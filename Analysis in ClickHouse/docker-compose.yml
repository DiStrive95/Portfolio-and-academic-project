services: 
    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: clickhouse_db
        restart: always
        ports:
          - "8123:8123"
          - "9000:9000"
        ulimits:
          nofile:
            soft: 262144
            hard: 262144
        environment:
          CLICKHOUSE_USER: user
          CLICKHOUSE_PASSWORD: strongpassword
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
