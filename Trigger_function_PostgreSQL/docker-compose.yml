services:
  postgres:
    build:
      context: .
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: POSTGRES_DB
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
        postgres -c shared_preload_libraries=pg_cron
                 -c cron.database_name=POSTGRES_DB

volumes:
  pgdata: